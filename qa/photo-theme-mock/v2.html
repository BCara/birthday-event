<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:'Quicksand',sans-serif; background:#eee; padding:30px; }
  .card { width:440px; margin:0 auto; background:linear-gradient(160deg,#F6F0FF,#EBD9FF);
          border-radius:26px; padding:30px 26px; box-shadow:0 12px 34px rgba(0,0,0,.14); }
  .invited { text-align:center; }
  .invited span { background:#9b5de5; color:#fff; font-weight:700; font-size:12px; letter-spacing:1px;
                  padding:6px 16px; border-radius:999px; }
  .wrap { display:flex; align-items:center; gap:14px; margin-top:18px; }
  .left { flex:0 0 150px; }
  .left img { width:150px; display:block; filter:drop-shadow(0 12px 22px rgba(0,0,0,.12)); }
  .right { flex:1; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .title { font-family:'Satisfy',cursive; color:#5b2a86; font-size:34px; line-height:1.05; text-align:center; margin:0; }
  .photo { width:128px; height:128px; border-radius:50%; border:5px solid #fff; background:
           radial-gradient(circle at 50% 35%, #ffd9b3, #e89b6c); box-shadow:0 8px 22px rgba(0,0,0,.2);
           display:flex; align-items:center; justify-content:center; font-size:46px; }
  .sub { text-align:center; color:#7a4ea8; margin:16px 0 0; font-weight:600; }
</style></head>
<body>
  <div class="card">
    <div class="invited"><span>🎉 YOU'RE INVITED!</span></div>
    <div class="wrap">
      <div class="left"><img src="../../public/images/themes/unicorn_purple.png" alt="unicorn"></div>
      <div class="right">
        <h1 class="title">Robin's 3rd Birthday</h1>
        <div class="photo">🧒</div>
      </div>
    </div>
    <p class="sub">✨ Join us for a magical celebration! ✨</p>
  </div>
</body></html>
