<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Quicksand','Trebuchet MS',sans-serif; background:#eee; padding:24px; }
  .row { display:flex; gap:24px; flex-wrap:wrap; justify-content:center; }
  .card { width:330px; background:linear-gradient(160deg,#FFF5F5,#FFE3E3); border-radius:24px;
          padding:28px 20px 24px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.12); position:relative; overflow:hidden; }
  .label { font-weight:700; color:#444; margin:0 0 10px; font-size:15px; text-align:center; }
  .photo { background:radial-gradient(circle at 50% 35%, #ffd9b3, #e89b6c); display:flex; align-items:center;
           justify-content:center; font-size:54px; }
  .ill { display:block; }
  .name { font-family:'Merriweather',Georgia,serif; color:#7a1f1f; font-weight:700; margin:14px 0 2px; }
  .sub { color:#9a5a5a; font-size:13px; margin:0; }

  /* A: photo hero + theme ring + small accent */
  .a-photo { width:168px; height:168px; border-radius:50%; margin:8px auto 0; border:7px solid #fff;
             box-shadow:0 0 0 6px #E53935, 0 10px 24px rgba(0,0,0,.18); }
  .a-accent { position:absolute; top:14px; left:14px; width:86px; transform:rotate(-8deg); }

  /* B: theme arch header + photo avatar below */
  .b-head { width:100%; height:120px; object-fit:contain; margin-bottom:-44px; }
  .b-photo { width:120px; height:120px; border-radius:50%; border:6px solid #fff; box-shadow:0 8px 20px rgba(0,0,0,.18);
             position:relative; margin:0 auto; }

  /* C: photo centre flanked by theme */
  .c-wrap { display:flex; align-items:center; justify-content:center; gap:0; }
  .c-ill { width:96px; }
  .c-ill.flip { transform:scaleX(-1); }
  .c-photo { width:140px; height:140px; border-radius:50%; border:6px solid #fff; box-shadow:0 8px 20px rgba(0,0,0,.18); margin:0 -14px; z-index:2; }
</style></head>
<body>
  <div class="row">

    <div class="card">
      <p class="label">A · Photo hero + themed ring (theme as small accent)</p>
      <img class="ill a-accent" src="../../public/images/themes/classic_red.png" alt="">
      <div class="photo a-photo">👧</div>
      <h3 class="name">Ella's 5th Birthday</h3>
      <p class="sub">Celebrating Ella!</p>
    </div>

    <div class="card">
      <p class="label">B · Theme banner + photo avatar</p>
      <img class="ill b-head" src="../../public/images/themes/classic_red.png" alt="">
      <div class="photo b-photo">👧</div>
      <h3 class="name">Ella's 5th Birthday</h3>
      <p class="sub">Celebrating Ella!</p>
    </div>

    <div class="card">
      <p class="label">C · Photo flanked by theme</p>
      <div class="c-wrap">
        <img class="ill c-ill" src="../../public/images/themes/classic_red.png" alt="">
        <div class="photo c-photo">👧</div>
        <img class="ill c-ill flip" src="../../public/images/themes/classic_red.png" alt="">
      </div>
      <h3 class="name">Ella's 5th Birthday</h3>
      <p class="sub">Celebrating Ella!</p>
    </div>

  </div>
</body></html>
